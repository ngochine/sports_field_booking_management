{%extends 'layout/base.html'%}

{%block title%}Đăng nhập{%endblock%}

{%block body%}
<div class="container my-5 border rounded shadow-lg p-0">
    <div class="row">

        <div class="col-md-5 d-none d-md-block">
            <img src="https://res.cloudinary.com/dsfv5nawc/image/upload/v1775032058/Padel_1_fr0qqu.jpg"
                 class="img-fluid h-100 w-100 object-fit-cover">
        </div>

        <div class="col-md-6 col-12 p-5 ms-5">
            <h3 class="text-center mt-3" style="color: var(--orange)">ĐĂNG NHẬP</h3>
            <small class="text-center d-block mb-3 fst-italic">
                Nhập thông tin tài khoản của bạn
            </small>

            <form id="loginForm" onsubmit="login(event)">
                <div class="form-floating mb-3 mt-3">
                    <input type="text" class="form-control" id="username" name="username" placeholder="Nhập tên người dùng" required>
                    <label for="username">Tên người dùng</label>
                </div>

                <div class="form-floating mt-3 mb-3">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu" required>
                    <label for="password">Mật khẩu</label>
                    <button type="button" onclick="togglePassword('password', this)"
                        class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <button type="submit" class="btn w-100" style="background-color: var(--orange); color: var(--white)">
                    Đăng nhập
                </button>
            </form>

            <small class="text-center d-block mt-3">
                Chưa có tài khoản?
                <a class="text-decoration-none" style="color: var(--orange)" href="{{ url_for('auth.register') }}">Đăng ký</a>
            </small>
        </div>

    </div>
</div>
{%endblock%}
